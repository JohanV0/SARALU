{%load static%}
<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>

    <!-- Tipografías: una elegante para títulos y una limpia para el resto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    // Caja de crayones: los 4 colores de la paleta
                    colors: {
                        azul: "#b1c8ea",
                        mantequilla: "#ffebaa",
                        chocolate: "#382322",
                        crema: "#fdebde",
                    },
                    fontFamily: {
                        titulo: ['"Playfair Display"', "serif"],
                        cuerpo: ["Inter", "sans-serif"],
                    },
                },
            },
        };

        // Aplica el tema guardado ANTES de dibujar la página (por defecto: claro)
        if (localStorage.getItem("tema") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>

<body class="relative flex min-h-[100dvh] items-center justify-center px-4 py-8
             font-cuerpo antialiased
             bg-azul text-chocolate
             dark:bg-chocolate dark:text-crema
             transition-colors duration-500">

    <!-- Manchas de color de fondo -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-32 -left-32 h-96 w-96 rounded-full
                    bg-mantequilla/70 dark:bg-azul/20 blur-3xl"></div>
        <div class="absolute -bottom-32 -right-32 h-96 w-96 rounded-full
                    bg-crema/70 dark:bg-mantequilla/15 blur-3xl"></div>
    </div>

    <!-- Botón de tema -->
    <button
        type="button"
        id="btn-tema"
        aria-label="Cambiar tema"
        class="fixed top-4 right-4 z-50 flex h-11 w-11 items-center justify-center rounded-full
               bg-crema text-chocolate ring-1 ring-chocolate/20 shadow-md shadow-chocolate/10
               dark:bg-mantequilla dark:text-chocolate dark:ring-0
               hover:scale-110 transition">

        <!-- Sol: solo se ve en modo oscuro (para pasar a claro) -->
        <svg class="hidden dark:block h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>

        <!-- Luna: solo se ve en modo claro (para pasar a oscuro) -->
        <svg class="block dark:hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
    </button>

    <!-- Tarjeta -->
    <main class="relative z-10 mx-auto my-auto w-full max-w-md sm:max-w-xl lg:max-w-2xl rounded-3xl p-6 sm:p-10
                 bg-crema ring-1 ring-chocolate/10 shadow-2xl shadow-chocolate/30
                 dark:bg-white/[0.06] dark:ring-white/10 dark:shadow-black/50
                 backdrop-blur-xl">

        <!-- Logo y título -->
        <div class="text-center mb-8">
            <div class="mx-auto mb-6 flex h-28 w-28 items-center justify-center overflow-hidden rounded-full
                        bg-mantequilla ring-4 ring-azul">
                <img src="{% static 'img/logo.png' %}" alt="Logo Saralu" class="h-full w-full object-contain p-3">
            </div>
            <h1 class="font-titulo text-3xl font-bold tracking-tight text-chocolate dark:text-crema">Crear cuenta</h1>
            <p class="mt-2 text-sm text-chocolate/70 dark:text-crema/70">
                Regístrate para gestionar tus tatuajes y citas
            </p>
        </div>

        <!-- Errores generales del formulario (si tu vista los envía en "errors") -->
        {% if errors %}
        <div class="mb-5 rounded-xl px-4 py-3 text-sm
                    bg-red-100 text-red-700 ring-1 ring-red-200
                    dark:bg-red-500/10 dark:text-red-300 dark:ring-red-500/30">
            <ul class="list-disc pl-4 space-y-0.5">
                {% for error in errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Usuario -->
            <div>
                <label for="username" class="mb-1.5 block text-sm font-medium">Usuario</label>
                <div class="group relative">
                    <svg class="absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2
                                text-chocolate/40 dark:text-crema/40
                                group-focus-within:text-chocolate dark:group-focus-within:text-azul transition-colors"
                         fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="Nombre de usuario"
                        value="{{ datos.username|default:'' }}"
                        required
                        class="w-full rounded-xl py-3 pl-11 pr-4 text-sm
                               bg-white text-chocolate placeholder-chocolate/40 ring-1 ring-chocolate/25
                               dark:bg-black/25 dark:text-crema dark:placeholder-crema/40 dark:ring-crema/15
                               focus:outline-none focus:ring-2 focus:ring-chocolate dark:focus:ring-azul transition">
                </div>
            </div>

            <!-- Nombre y Apellido en la misma fila -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="mb-1.5 block text-sm font-medium">Nombre</label>
                    <input
                        type="text"
                        name="first_name"
                        id="first_name"
                        placeholder="Nombre"
                        value="{{ datos.first_name|default:'' }}"
                        required
                        class="w-full rounded-xl px-4 py-3 text-sm
                               bg-white text-chocolate placeholder-chocolate/40 ring-1 ring-chocolate/25
                               dark:bg-black/25 dark:text-crema dark:placeholder-crema/40 dark:ring-crema/15
                               focus:outline-none focus:ring-2 focus:ring-chocolate dark:focus:ring-azul transition">
                </div>
                <div>
                    <label for="last_name" class="mb-1.5 block text-sm font-medium">Apellido</label>
                    <input
                        type="text"
                        name="last_name"
                        id="last_name"
                        placeholder="Apellido"
                        value="{{ datos.last_name|default:'' }}"
                        required
                        class="w-full rounded-xl px-4 py-3 text-sm
                               bg-white text-chocolate placeholder-chocolate/40 ring-1 ring-chocolate/25
                               dark:bg-black/25 dark:text-crema dark:placeholder-crema/40 dark:ring-crema/15
                               focus:outline-none focus:ring-2 focus:ring-chocolate dark:focus:ring-azul transition">
                </div>
            </div>

            <!-- Correo -->
            <div>
                <label for="email" class="mb-1.5 block text-sm font-medium">Correo</label>
                <div class="group relative">
                    <svg class="absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2
                                text-chocolate/40 dark:text-crema/40
                                group-focus-within:text-chocolate dark:group-focus-within:text-azul transition-colors"
                         fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                    </svg>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="tucorreo@ejemplo.com"
                        value="{{ datos.email|default:'' }}"
                        required
                        class="w-full rounded-xl py-3 pl-11 pr-4 text-sm
                               bg-white text-chocolate placeholder-chocolate/40 ring-1 ring-chocolate/25
                               dark:bg-black/25 dark:text-crema dark:placeholder-crema/40 dark:ring-crema/15
                               focus:outline-none focus:ring-2 focus:ring-chocolate dark:focus:ring-azul transition">
                </div>
            </div>

            <!-- Contraseña -->
            <div>
                <label for="password1" class="mb-1.5 block text-sm font-medium">Contraseña</label>
                <div class="group relative">
                    <svg class="absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2
                                text-chocolate/40 dark:text-crema/40
                                group-focus-within:text-chocolate dark:group-focus-within:text-azul transition-colors"
                         fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                    </svg>
                    <input
                        type="password"
                        name="password1"
                        id="password1"
                        placeholder="Crea una contraseña"
                        value="{{ datos.password1|default:'' }}"
                        required
                        class="w-full rounded-xl py-3 pl-11 pr-4 text-sm
                               bg-white text-chocolate placeholder-chocolate/40 ring-1 ring-chocolate/25
                               dark:bg-black/25 dark:text-crema dark:placeholder-crema/40 dark:ring-crema/15
                               focus:outline-none focus:ring-2 focus:ring-chocolate dark:focus:ring-azul transition">
                </div>
            </div>

            <!-- Confirmar contraseña -->
            <div>
                <label for="password2" class="mb-1.5 block text-sm font-medium">Confirmar contraseña</label>
                <div class="group relative">
                    <svg class="absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2
                                text-chocolate/40 dark:text-crema/40
                                group-focus-within:text-chocolate dark:group-focus-within:text-azul transition-colors"
                         fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                    </svg>
                    <input
                        type="password"
                        name="password2"
                        id="password2"
                        placeholder="Repite la contraseña"
                        value="{{ datos.password2|default:'' }}"
                        required
                        class="w-full rounded-xl py-3 pl-11 pr-4 text-sm
                               bg-white text-chocolate placeholder-chocolate/40 ring-1 ring-chocolate/25
                               dark:bg-black/25 dark:text-crema dark:placeholder-crema/40 dark:ring-crema/15
                               focus:outline-none focus:ring-2 focus:ring-chocolate dark:focus:ring-azul transition">
                </div>
            </div>

            <button
                type="submit"
                class="w-full rounded-xl py-3 font-semibold
                       bg-chocolate text-mantequilla shadow-lg shadow-chocolate/25
                       hover:bg-chocolate/90
                       dark:bg-mantequilla dark:text-chocolate dark:shadow-none
                       dark:hover:bg-mantequilla/90
                       active:scale-[0.98] transition">
                Crear cuenta
            </button>

            <!-- Enlace de vuelta al login -->
            <p class="text-center text-sm text-chocolate/70 dark:text-crema/70">
                ¿Ya tienes cuenta?
                <a href="{% url 'login' %}" class="font-semibold text-chocolate underline underline-offset-2
                                                     hover:text-chocolate/70
                                                     dark:text-mantequilla dark:hover:text-mantequilla/80 transition-colors">
                    Inicia sesión
                </a>
            </p>
        </form>
    </main>

    <script>
        document.getElementById("btn-tema").addEventListener("click", function () {
            const esOscuro = document.documentElement.classList.toggle("dark");
            localStorage.setItem("tema", esOscuro ? "dark" : "light");
        });
    </script>
</body>
</html>
