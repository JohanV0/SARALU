{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — SARALU</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: {
          'sm': '640px', 'md': '768px', 'lg': '1024px', 'xl': '1280px',
          '2xl': '1536px', '3xl': '1920px', '4xl': '2560px',
        },
        extend: {
          colors: {
            mantequilla: "#ffd97a", chocolate: "#4a3528", crema: "#fdf8e7",
            rosa: "#f4b8c8", rosaClaro: "#fbe3ea", cafe: "#8b6f5c", azul: "#b1c8ea",
          },
          fontFamily: {
            display: ['"Fredoka"', 'system-ui', 'sans-serif'],
            script: ['"Pacifico"', 'cursive'],
            body: ['"Nunito"', 'sans-serif'],
          },
          boxShadow: {
            soft: "0 8px 30px -14px rgba(74, 53, 40, 0.20)",
            lift: "0 24px 55px -25px rgba(74, 53, 40, 0.30)",
            glow: "0 12px 40px -12px rgba(255, 217, 122, 0.55)",
          },
          letterSpacing: { widest2: "0.3em" },
          keyframes: {
            float: {
              "0%,100%": { transform: "translateY(0) rotate(var(--r,0deg))" },
              "50%": { transform: "translateY(-16px) rotate(calc(var(--r,0deg) + 14deg))" },
            },
            twinkle: {
              "0%,100%": { opacity: ".4", transform: "scale(.85)" },
              "50%": { opacity: "1", transform: "scale(1.2)" },
            },
          },
          animation: {
            float: "float 6s ease-in-out infinite",
            twinkle: "twinkle 2.6s ease-in-out infinite",
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body class="relative flex min-h-[100dvh] items-center justify-center overflow-x-hidden bg-crema px-3 py-10 font-body antialiased text-chocolate selection:bg-rosaClaro selection:text-chocolate sm:px-4 sm:py-16">

  <!-- ===== FONDO: logo disimulado ===== -->
  <div class="pointer-events-none fixed inset-0" aria-hidden="true">
    <div class="absolute inset-0 bg-center bg-no-repeat opacity-[0.40] blur-[2px] mix-blend-multiply
                [-webkit-mask-image:radial-gradient(circle,black_30%,transparent_68%)]
                [mask-image:radial-gradient(circle,black_30%,transparent_68%)]"
         style="background-image:url('{% static 'img/logo.png' %}'); background-size:min(1200px,160vw) auto;">
    </div>
    <div class="absolute -top-32 -left-32 h-72 w-72 rounded-full bg-rosa/35 blur-3xl sm:h-96 sm:w-96"></div>
    <div class="absolute -bottom-32 -right-32 h-72 w-72 rounded-full bg-mantequilla/50 blur-3xl sm:h-96 sm:w-96"></div>
    <div class="absolute top-1/3 -right-24 h-56 w-56 rounded-full bg-azul/30 blur-3xl sm:h-72 sm:w-72"></div>
  </div>

  <!-- ===== Chispitas flotando + estrellas ===== -->
  <div class="pointer-events-none fixed inset-0" aria-hidden="true">
    <span class="absolute top-[14%] left-[10%] h-1.5 w-5 rounded-full bg-rosa animate-float" style="--r:35deg"></span>
    <span class="absolute top-[26%] right-[12%] h-1.5 w-5 rounded-full bg-mantequilla animate-float" style="--r:-30deg; animation-delay:-2s"></span>
    <span class="absolute bottom-[22%] left-[14%] h-1.5 w-5 rounded-full bg-azul animate-float" style="--r:70deg; animation-delay:-4s"></span>
    <span class="absolute bottom-[12%] right-[18%] h-1.5 w-5 rounded-full bg-rosa animate-float" style="--r:-60deg; animation-delay:-1s"></span>
    <span class="hidden sm:block absolute top-[48%] left-[5%] h-1.5 w-4 rounded-full bg-mantequilla animate-float" style="--r:10deg; animation-delay:-3s"></span>
    <span class="hidden sm:block absolute top-[8%] right-[30%] h-1.5 w-4 rounded-full bg-azul animate-float" style="--r:-15deg; animation-delay:-5s"></span>

    <span class="absolute top-16 left-[14%] text-mantequilla text-2xl sm:text-3xl animate-twinkle">✦</span>
    <span class="absolute bottom-20 right-[8%] text-rosa text-xl sm:text-2xl animate-twinkle" style="animation-delay:-1s">✦</span>
    <span class="hidden sm:block absolute top-[40%] right-[6%] text-azul text-xl animate-twinkle" style="animation-delay:-2s">✦</span>
    <span class="hidden sm:block absolute bottom-[30%] left-[8%] text-rosa text-xl animate-twinkle" style="animation-delay:-.5s">✦</span>
  </div>

  <!-- ===== Tarjeta ===== -->
  <div class="relative z-10 mt-8 w-full max-w-md sm:mt-10 sm:max-w-xl lg:max-w-2xl">

    <!-- Osito del logo asomando -->
    <div class="absolute -top-11 left-1/2 z-20 h-22 w-22 -translate-x-1/2 overflow-hidden rounded-full bg-crema ring-4 ring-white shadow-lift
                sm:-top-14 sm:h-28 sm:w-28">
      <img src="{% static 'img/logo.png' %}" alt="Logo SARALU"
           class="absolute max-w-none"
           style="width:225px; left:-19px; top:-66px;" />
    </div>

    <main class="relative rounded-[2rem] bg-white/65 px-4 pb-8 pt-14 shadow-lift ring-1 ring-white/80 backdrop-blur-xl
                 outline outline-2 outline-dashed outline-rosa/60 outline-offset-[-12px]
                 sm:rounded-[2.5rem] sm:px-8 sm:pb-9 sm:pt-20 sm:outline-offset-[-14px]
                 lg:px-10">

      <!-- Título -->
      <div class="mb-7 text-center sm:mb-8">
        <div class="inline-flex items-center gap-2 rounded-full bg-white px-3 py-1.5 shadow-soft sm:px-4 sm:py-2">
          <span class="h-2 w-2 rounded-full bg-mantequilla"></span>
          <span class="text-[9px] font-bold uppercase tracking-widest2 text-cafe sm:text-xs">
            Únete a SARALU
          </span>
        </div>

        <h1 class="mt-4 font-display text-3xl font-semibold leading-[1.1] tracking-tight text-chocolate sm:mt-5 sm:text-4xl lg:text-5xl">
          Crea tu<br />
          <span class="font-script text-rosa text-4xl sm:text-5xl lg:text-6xl inline-block mt-1 pb-2 leading-[1.3] sm:mt-2">
            cuenta
          </span>
        </h1>
        <p class="mt-1 text-xs text-cafe sm:text-sm">Regístrate para endulzar tu día.</p>
      </div>

      <!-- Errores generales -->
      {% if errors %}
      <div class="mb-5 rounded-2xl bg-rosaClaro px-4 py-3 text-center text-xs font-bold text-chocolate sm:text-sm">
        <ul class="list-disc space-y-0.5 pl-4 text-left">
          {% for error in errors %}
          <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}

      <form method="POST" class="space-y-4 sm:space-y-5">
        {% csrf_token %}

        <!-- Fila 1: Usuario | Nombre | Apellido -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <div class="sm:col-span-2 lg:col-span-1">
            <label for="username" class="mb-1.5 ml-4 block text-[10px] font-bold uppercase tracking-widest2 text-cafe sm:text-[11px]">Usuario</label>
            <div class="group relative">
              <svg class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-cafe/50 transition-colors group-focus-within:text-rosa"
                   fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
              </svg>
              <input
                type="text"
                name="username"
                id="username"
                placeholder="Usuario"
                value="{{ datos.username|default:'' }}"
                required
                autocomplete="username"
                class="w-full rounded-full bg-white/85 py-3 pl-12 pr-4 text-sm text-chocolate placeholder-cafe/50
                       shadow-soft ring-1 ring-transparent transition
                       focus:outline-none focus:ring-2 focus:ring-rosa sm:py-3.5 sm:pr-5" />
            </div>
          </div>

          <div>
            <label for="first_name" class="mb-1.5 ml-4 block text-[10px] font-bold uppercase tracking-widest2 text-cafe sm:text-[11px]">Nombre</label>
            <input
              type="text"
              name="first_name"
              id="first_name"
              placeholder="Nombre"
              value="{{ datos.first_name|default:'' }}"
              required
              autocomplete="given-name"
              class="w-full rounded-full bg-white/85 px-5 py-3 text-sm text-chocolate placeholder-cafe/50
                     shadow-soft ring-1 ring-transparent transition
                     focus:outline-none focus:ring-2 focus:ring-rosa sm:py-3.5" />
          </div>

          <div>
            <label for="last_name" class="mb-1.5 ml-4 block text-[10px] font-bold uppercase tracking-widest2 text-cafe sm:text-[11px]">Apellido</label>
            <input
              type="text"
              name="last_name"
              id="last_name"
              placeholder="Apellido"
              value="{{ datos.last_name|default:'' }}"
              required
              autocomplete="family-name"
              class="w-full rounded-full bg-white/85 px-5 py-3 text-sm text-chocolate placeholder-cafe/50
                     shadow-soft ring-1 ring-transparent transition
                     focus:outline-none focus:ring-2 focus:ring-rosa sm:py-3.5" />
          </div>
        </div>

        <!-- Fila 2: Correo | Contraseña | Confirmar -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <div class="sm:col-span-2 lg:col-span-1">
            <label for="email" class="mb-1.5 ml-4 block text-[10px] font-bold uppercase tracking-widest2 text-cafe sm:text-[11px]">Correo</label>
            <div class="group relative">
              <svg class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-cafe/50 transition-colors group-focus-within:text-rosa"
                   fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
              </svg>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="tucorreo@ejemplo.com"
                value="{{ datos.email|default:'' }}"
                required
                autocomplete="email"
                class="w-full rounded-full bg-white/85 py-3 pl-12 pr-4 text-sm text-chocolate placeholder-cafe/50
                       shadow-soft ring-1 ring-transparent transition
                       focus:outline-none focus:ring-2 focus:ring-rosa sm:py-3.5 sm:pr-5" />
            </div>
          </div>

          <div>
            <label for="password1" class="mb-1.5 ml-4 block text-[10px] font-bold uppercase tracking-widest2 text-cafe sm:text-[11px]">Contraseña</label>
            <div class="group relative">
              <svg class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-cafe/50 transition-colors group-focus-within:text-rosa"
                   fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
              </svg>
              <input
                type="password"
                name="password1"
                id="password1"
                placeholder="Contraseña"
                value="{{ datos.password1|default:'' }}"
                required
                autocomplete="new-password"
                class="w-full rounded-full bg-white/85 py-3 pl-12 pr-4 text-sm text-chocolate placeholder-cafe/50
                       shadow-soft ring-1 ring-transparent transition
                       focus:outline-none focus:ring-2 focus:ring-rosa sm:py-3.5 sm:pr-5" />
            </div>
          </div>

          <div>
            <label for="password2" class="mb-1.5 ml-4 block text-[10px] font-bold uppercase tracking-widest2 text-cafe sm:text-[11px]">Confirmar</label>
            <div class="group relative">
              <svg class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-cafe/50 transition-colors group-focus-within:text-rosa"
                   fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
              </svg>
              <input
                type="password"
                name="password2"
                id="password2"
                placeholder="Repite"
                value="{{ datos.password2|default:'' }}"
                required
                autocomplete="new-password"
                class="w-full rounded-full bg-white/85 py-3 pl-12 pr-4 text-sm text-chocolate placeholder-cafe/50
                       shadow-soft ring-1 ring-transparent transition
                       focus:outline-none focus:ring-2 focus:ring-rosa sm:py-3.5 sm:pr-5" />
            </div>
          </div>
        </div>

        <!-- Botón -->
        <div class="pt-1 lg:flex lg:justify-center">
          <button
            type="submit"
            class="group inline-flex w-full items-center justify-center gap-3 rounded-full bg-chocolate px-7 py-3.5 text-sm font-bold text-mantequilla
                   shadow-soft transition-all hover:-translate-y-1 hover:bg-cafe active:scale-[0.98] lg:w-72">
            Crear cuenta
            <svg class="h-4 w-4 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>

        <p class="text-center text-xs text-cafe sm:text-sm">
          ¿Ya tienes cuenta?
          <a href="{% url 'login' %}"
             class="font-bold text-chocolate underline decoration-rosa decoration-2 underline-offset-4 transition-colors hover:text-cafe">
            Inicia sesión
          </a>
        </p>
      </form>

      <div class="mt-5 text-center sm:mt-6">
        <a href="{% url 'home' %}"
           class="inline-flex items-center gap-2 text-[9px] font-bold uppercase tracking-widest2 text-cafe/70 transition-colors hover:text-chocolate sm:text-[10px]">
          <span aria-hidden="true">←</span> Volver al inicio
        </a>
      </div>
    </main>
  </div>
</body>
</html>
